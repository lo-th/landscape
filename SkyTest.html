<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - sky</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - sky">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_sky.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_sky.jpg">
	</head>
	<body style="background-color:#000; margin:0; padding:0; overflow:hidden; font-family:Monospace;">

		<script type="importmap">
			{
            "imports": {
                "three": "./node_modules/three/build/three.webgpu.js",
                "three/webgpu": "./node_modules/three/build/three.webgpu.js",
                "three/tsl": "./node_modules/three/build/three.tsl.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import * as UIL from './src//libs/uil.module.min.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Sky } from './src/Sky.js';

			const WebGpu = true;

			let camera, scene, renderer, timer;

			let sky, sun, moon;

			let sphere, cubeCamera;
			const torad = Math.PI/180;
			const todeg = 180/Math.PI;

			init();

			function initSky() {

				// Add Sky
				sky = new Sky(renderer, scene, sun, moon );
				sky.addBackgroudBox( 1000 )

				scene.environmentIntensity = 3;
				//scene.backgroundIntensity = 1.1;
				//sky.mesh.scale.setScalar( 1000 );

				const m = 2

				const ui = new UIL.Gui( { w:280, h:24, css:'top:14px; left:14px;', bottomText:['options', 'close' ] , open:false} )



				ui.add( renderer, 'toneMappingExposure',   { rename:'Exposure',   min:0, max:2, mode:m, color:'#0ff' } )
				ui.add( scene, 'environmentIntensity',   { rename:'Envmap',   min:0, max:10, mode:m, color:'#0ff' } )
				ui.add( scene, 'backgroundIntensity',   { rename:'Background',   min:0, max:10, mode:m, color:'#0ff' } )

				//ui.add( sun, 'phi',   { rename:'phi',   min:0, max:360, precision:0, step:1, mode:m, color:'#ff0' } ).onChange(sun.orient )
				//ui.add( sun, 'theta', { rename:'theta', min:0, max:360, precision:0, step:1, mode:m, color:'#ff0' } ).onChange(sun.orient )
				ui.add( sky, 'resolution', { rename:'Resolution', type:'selector', unselect:false, values:[ 128, 256, 512, 1024 ], h:25 }).onChange((v)=>{ sky.resize(v) })
				ui.add( sky, 'hour', { rename:'HOUR', min:0.0, max:24, precision:2, mode:m, color:'#ff0' } )//.onChange( sky.upTime )
				ui.add( sky, 'azimuth', { rename:'Azimuth', min:0.0, max:360, precision:2, mode:m, color:'#ff0' } )//.onChange( sky.upTime )
				//ui.add( sky, 'power', { rename:'Power', min:0.0, max:100, precision:2, mode:m, color:'#ff0' } )


				ui.add( sky.cloud_size, 'value', { rename:'cloud_size', min:0.0, max:0.5, precision:4, mode:m, color:'#fff' } )
				ui.add( sky.cloud_cover, 'value', { rename:'cloud_cover', min:0.0, max:1, mode:m, color:'#fff' } )
				ui.add( sky.cloud_dens, 'value', { rename:'cloud_dens', min:0.0, max:1, mode:m, color:'#fff' } )
				ui.add( sky.cloud_dist, 'value', { rename:'cloud_dist', min:0.0, max:1, mode:m, color:'#fff' } )
				ui.add( sky.cloud_thickness , 'value', { rename:'cloud_layer', min:0.1, max:6, mode:m, color:'#fff' } )

				ui.add( sky.fogy, 'value', { rename:'fogy', min:0.0, max:1, mode:m, color:'#fff' } )
				ui.add( sky.haze, 'value', { rename:'haze', min:0.0, max:1, mode:m, color:'#fff' } )
				ui.add( sky.nightLuminosity, 'value', { rename:'night', min:0.0, max:1, mode:m, color:'#fff' } )

				ui.add( sky.SAMPLE, 'value', { rename:'SAMPLE', min:1, max:128, precision:0, step:1, mode:m, color:'#f85' } )
				ui.add( sky.STEP, 'value', { rename:'STEP', min:0, max:32, precision:0, step:1, mode:m, color:'#f85' } )

				ui.add( sky.moon_phase, 'value', { rename:'moon phase', min:0.0, max:1, mode:m, precision:3,step:0.125, color:'#fff' } )

				ui.add( sky, 'color_sky', { rename:'ground' } )
				ui.add( sky, 'color_cloud', { rename:'cloud' } )
				ui.add( sky, 'color_fog', { rename:'fog' } )
				ui.add( sky, 'color_ground', { rename:'ground' } )


				//ui.add( sky.c_ground, 'value', { rename:'ground', type:'color' } )




				addModel2()

			}

			async function addModel0(){

		        sphere = new THREE.Mesh(
					new THREE.SphereGeometry( 10, 64, 32 ),
					new THREE.MeshStandardNodeMaterial({roughness:0, metalness:1})// { envMap: cubeRenderTarget.texture } )
				);

				//sphere.position.y = 30
				scene.add( sphere );
		    }

			


			async function addModel2(){

		        const loader = new GLTFLoader();
		        const glb = await loader.loadAsync( './assets/models/venus.glb')
		        const model = glb.scene;

		        glb.scene.traverse( function ( object ) {
		            if ( object.isMesh ){
		                object.castShadow = true;
		                object.receiveShadow = true;
		                object.material.shadowSide = THREE.DoubleSide;
		                object.material.metalness = 0.0;
		                object.material.roughness = 0.2;
		            }
		        })

		       //model.scale.set(1,40,40)
		       // model.position.y = -30//.set(100,100,100)


		        scene.add( model );
		    }

			async function addModel(){

		        const loader = new GLTFLoader();
		        const glb = await loader.loadAsync( './assets/models/skull.glb')
		        const model = glb.scene;

		        glb.scene.traverse( function ( object ) {
		            if ( object.isMesh ){
		                object.castShadow = true;
		                object.receiveShadow = true;
		                object.material.shadowSide = THREE.DoubleSide;
		                object.material.metalness = 0.0;
		                object.material.roughness = 0.2;
		            }
		        })

		        model.scale.set(40,40,40)
		        //model.position.y = -30//.set(100,100,100)


		        scene.add( model );
		    }

			async function init() {

				camera = new THREE.PerspectiveCamera( 55, window.innerWidth / window.innerHeight, 0.1, 2000 );
				camera.position.set( 0, 0.7, 2 );

				scene = new THREE.Scene();

				//const cubeRenderTarget = new THREE.CubeRenderTarget( 256, { type: THREE.HalfFloatType } );
				//cubeCamera = new THREE.CubeCamera( 1, 1000, cubeRenderTarget );

				timer = new THREE.Timer();
				timer.connect( document );


				renderer = new THREE.WebGPURenderer({ 
			        antialias:false, 
			        forceWebGL:!WebGpu, 
			        powerPreference: 'high-performance',
			        alpha: false,
			        stencil: false,
			        depth: true
			    });

				await renderer.init();
				renderer.setPixelRatio(1.0);
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				//renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMapping = THREE.NeutralToneMapping;
				//renderer.toneMapping = THREE.AgXToneMapping;
				renderer.toneMappingExposure = 0.9;
				renderer.inspector = new Inspector();
				renderer.shadowMap.enabled = true;
				//renderer.shadowMap.type = THREE.PCFShadowMap;
				document.body.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set(0,0.7,0)
				controls.update();
				//controls.maxPolarAngle = Math.PI / 2;
				//controls.enableZoom = false;
				//controls.enablePan = false;


				sun = new THREE.DirectionalLight( 0xf6faf4, 2.0 );
				sun.position.set(0,2,0)

				//sun.phi = 12
				//sun.theta = 0
				//sun.distance = 100;

				sun.castShadow = true;
			    //sun.shadow.autoUpdate = false;
			    const range = 2
			    sun.shadow.mapSize.set( 2048, 2048 );
			    sun.shadow.camera.near = 1;
			    sun.shadow.camera.far = 10;
			    sun.shadow.camera.top = range;
			    sun.shadow.camera.right = range;
			    sun.shadow.camera.bottom = - range;
			    sun.shadow.camera.left = - range;
			    //sun.shadow.camera.bias = -0.0005;
			    //sun.shadow.camera.radius = 4;
			    sun.target.position.y = 0.7
				scene.add( sun, sun.target );

				moon = new THREE.DirectionalLight( 0xaabbcc, 1.0 );
				moon.target.position.y = 0.7
				scene.add( moon, moon.target );


				//scene.add( new THREE.CameraHelper( sun.shadow.camera ) );

				initSky();


				

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate( stamp ) {

				//timer.update(stamp);
				//let delta = timer.getDelta()


				renderer.render( scene, camera );

				if(sky) sky.update();

				

			}

		</script>

	</body>

</html>
